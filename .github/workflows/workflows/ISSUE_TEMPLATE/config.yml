# .github/ISSUE_TEMPLATE/config.yml
# Controls the issue template chooser.
# Docs: https://docs.github.com/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

blank_issues_enabled: false
contact_links:
  - name: 💬 Start a discussion
    url: https://github.com/FED-OS/discussions
    about: For questions, ideas, lore, and show & tell — use Discussions, not issues.
  - name: 🔒 Report a security vulnerability
    url: https://github.com/FED-OS/security/advisories/new
    about: Please report security issues privately. Do NOT open a public issue.
  - name: 📖 Read the FAQ
    url: https://github.com/FED-OS/blob/main/fedmon/FAQ.md
    about: Check the FAQ before opening an issue — your answer may be there.
  - name: 📜 Read CONTRIBUTING.md
    url: https://github.com/FED-OS/blob/main/fedmon/CONTRIBUTING.md
    about: Contributing rules and constraints (vanilla only, no reused layouts, etc.).
