name: Dependency Review

# Review dependency changes in PRs. The FEDMON promo page has no runtime
# dependencies, but this workflow guards against accidental dependency
# introduction in GitHub Actions workflows or any future package files.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          # Fail on high/critical license or security issues.
          fail-on-severity: high
          # Reject unknown licenses (the project is MIT; keep it clean).
          deny-licenses: GPL-3.0, AGPL-3.0, Unlicense
          comment-summary-in-pr: on-failure
