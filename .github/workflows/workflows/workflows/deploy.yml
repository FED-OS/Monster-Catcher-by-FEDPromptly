name: Deploy (alias)

# Alias workflow that triggers the canonical Pages deployment.
# The authoritative deploy is .github/workflows/pages.yml.
# This file exists so "deploy" is discoverable by name in the Actions UI
# and can be manually dispatched. It re-runs pages.yml via workflow_call
# if supported, or simply duplicates the deploy for manual triggers.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fedmon/index.html'
      - 'fedmon/style.css'
      - 'fedmon/script.js'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          test -f fedmon/index.html
          test -f fedmon/style.css
          test -f fedmon/script.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: fedmon

      - name: Deploy
        uses: actions/deploy-pages@v4
