name: CD (Continuous Deployment preview)

# Continuous deployment to a preview/staging artifact on every PR.
# Production deploy to GitHub Pages is handled by pages.yml on main.
# This workflow uploads the site as a downloadable artifact so PRs
# can be previewed without deploying to a live environment.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preview-artifact:
    name: Build preview artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate source
        run: |
          test -f fedmon/index.html
          node --check fedmon/script.js || true

      - name: Zip preview
        run: |
          cd fedmon
          zip -r ../fedmon-preview.zip . -x ".*"
          cd ..

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: fedmon-preview-pr-${{ github.event.pull_request.number || 'manual' }}
          path: fedmon-preview.zip
          retention-days: 14

      - name: Comment on PR (if PR)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = `fedmon-preview-pr-${context.issue.number}`;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: [
                `📦 **Preview artifact built**: \`${artifactName}\``,
                ``,
                `Download it from the [workflow run](${url}) (Artifacts section), unzip, and open \`index.html\` locally to preview this PR.`,
                ``,
                `_Production deploy to GitHub Pages happens on merge to \`main\` via the \`pages.yml\` workflow._`
              ].join('\n')
            });
