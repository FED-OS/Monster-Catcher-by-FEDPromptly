name: Scorecards (supply-chain security)

# OpenSSF Scorecard analysis for the repo's supply-chain security posture.
# Runs on the default branch and on PRs. Results upload to the Scorecard API
# (if a token is provided) and can be viewed in the Security tab.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '31 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
