name: Release

# Create a GitHub Release (with the static-site zip as an asset) when a
# version tag is pushed. Versioning follows Semantic Versioning.
# Tags: vMAJOR.MINOR.PATCH  e.g. v2.1.0

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: echo "version=${GITHUB_REF_NAME:-manual}" >> "$GITHUB_OUTPUT"

      - name: Validate source
        run: |
          test -f fedmon/index.html
          test -f fedmon/style.css
          test -f fedmon/script.js
          node --check fedmon/script.js

      - name: Build release zip
        run: |
          mkdir -p release
          cd fedmon
          zip -r "../release/fedmon-no-mercy-${{ steps.ver.outputs.version }}.zip" \
            index.html style.css script.js README.md LICENSE .gitattributes assets
          cd ..

      - name: Write release body
        run: |
          cat > /tmp/release_body.md <<'EOF'
          ## FEDMON: NO MERCY — promo page bundle

          Unzip and open `index.html`, or deploy the contents to any static host
          (GitHub Pages recommended — see DEPLOYMENT.md).

          See CHANGELOG.md for what changed.
          EOF
          # de-indent the heredoc content
          sed -i 's/^          //' /tmp/release_body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: FEDMON NO MERCY ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: release/fedmon-no-mercy-${{ steps.ver.outputs.version }}.zip
          body_path: /tmp/release_body.md
