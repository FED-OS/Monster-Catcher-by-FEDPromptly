name: Greetings

# Welcome first-time contributors on their first issue or PR.

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    name: Greet first-timers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👊 Thanks for opening an issue for **FEDMON: NO MERCY**.

            A maintainer will triage it soon (look for the `needs-triage` label being swapped for a category).

            While you wait:
            - Check the [FAQ](https://github.com/${{ github.repository }}/blob/main/fedmon/FAQ.md)
            - Skim [CONTRIBUTING](https://github.com/${{ github.repository }}/blob/main/fedmon/CONTRIBUTING.md)
            - Search existing issues to avoid duplicates

            *The game is brutal. The community isn't.*
          pr-message: |
            🔥 Thanks for opening a PR for **FEDMON: NO MERCY**.

            A few things that speed up review:
            - Fill out the PR template fully (especially the "what's structurally new" section for visual changes).
            - Confirm you tested locally (`cd fedmon && python3 -m http.server 8765`).
            - No frameworks / build steps / external core assets — vanilla only.
            - No restyled clones of prior layouts (see ADR-007).

            Read [CONTRIBUTING](https://github.com/${{ github.repository }}/blob/main/fedmon/CONTRIBUTING.md) for the full rules.

            *No gyms. No badges. No mercy. But kindness in the PRs.*
