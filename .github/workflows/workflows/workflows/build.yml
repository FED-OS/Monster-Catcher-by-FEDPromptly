name: Build

# The FEDMON promo page has no build step (vanilla HTML/CSS/JS).
# This workflow validates that the site is "build-ready" — i.e. the
# source files are structurally sound and would serve correctly.
# It's intentionally lightweight; real validation lives in ci.yml.

on:
  push:
    branches: [main]
    paths:
      - 'fedmon/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fedmon/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-readiness:
    name: Verify build readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify required files
        run: |
          for f in index.html style.css script.js; do
            test -f "fedmon/$f" || { echo "missing fedmon/$f"; exit 1; }
          done
          echo "Required files present"

      - name: Verify no build dependencies expected
        run: |
          test ! -f fedmon/package.json || { echo "unexpected package.json (no build step allowed)"; exit 1; }
          echo "No package.json — correct (vanilla, no build step)"

      - name: Serve and probe
        run: |
          cd fedmon
          python3 -m http.server 8765 &
          SRV_PID=$!
          sleep 2
          CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8765/index.html)
          echo "index.html HTTP status: $CODE"
          [ "$CODE" = "200" ] || { kill $SRV_PID; exit 1; }
          BODY=$(curl -s http://localhost:8765/index.html)
          echo "$BODY" | grep -q "FEDMON: NO MERCY" || { echo "title not found in served HTML"; kill $SRV_PID; exit 1; }
          echo "$BODY" | grep -q 'stylesheet" href="style.css"' || { echo "stylesheet link missing"; kill $SRV_PID; exit 1; }
          echo "$BODY" | grep -q 'src="script.js"' || { echo "script link missing"; kill $SRV_PID; exit 1; }
          kill $SRV_PID
          echo "Serve probe passed ✅"

      - name: Verify asset references resolve
        run: |
          cd fedmon
          python3 -m http.server 8765 &
          SRV_PID=$!
          sleep 2
          for a in style.css script.js assets/social-image.png; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8765/$a")
            echo "$a -> $CODE"
            [ "$CODE" = "200" ] || { echo "asset $a not served"; kill $SRV_PID; exit 1; }
          done
          kill $SRV_PID
          echo "Assets resolve ✅"
