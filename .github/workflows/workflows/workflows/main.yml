name: Main

# Umbrella workflow that runs the core checks on every push to main and
# on dispatch. It re-uses jobs from ci.yml-style steps inline so the
# "Main" workflow name surfaces clearly in the Actions UI as the
# primary health check for the default branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Repo health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Core files
        run: |
          for f in index.html style.css script.js README.md LICENSE .gitignore SECURITY.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            test -f "fedmon/$f" || { echo "missing fedmon/$f"; exit 1; }
          done
          echo "Core files present"

      - name: Workflows present
        run: |
          for w in ci.yml pages.yml codeql.yml build.yml test.yml cd.yml deploy.yml release.yml publish.yml pr.yml stale.yml labeler.yml greetings.yml main.yml dependency-review.yml scorecards.yml; do
            test -f ".github/workflows/$w" || { echo "missing workflow $w"; exit 1; }
          done
          echo "All workflows present"

      - name: Templates present
        run: |
          test -f fedmon/.github/PULL_REQUEST_TEMPLATE.md
          test -f fedmon/.github/ISSUE_TEMPLATE/bug_report.md
          test -f fedmon/.github/ISSUE_TEMPLATE/feature_request.md
          test -f fedmon/.github/ISSUE_TEMPLATE/custom.md
          echo "Templates present"

      - name: Syntax & balance
        run: |
          python3 -c "s=open('fedmon/style.css').read(); assert s.count('{')==s.count('}')"
          python3 -c "s=open('fedmon/script.js').read(); assert s.count('{')==s.count('}')"
          node --check fedmon/script.js
          echo "Syntax OK"

      - name: Serve probe
        run: |
          cd fedmon && python3 -m http.server 8765 &
          sleep 2
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8765/index.html)" = "200" ]
          curl -s http://localhost:8765/index.html | grep -q "FEDMON: NO MERCY"
          echo "Serve OK"

      - name: Summary
        run: echo "Repo health check passed ✅"
